<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Zava GraphRAG Agent — Architecture</text>

  <!-- ================= LOCAL REGION ================= -->
  <rect x="30" y="80" width="580" height="660" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="52" y="108" font-size="15" font-weight="700" fill="#475569" letter-spacing="1.5">LOCAL · INTERN LAPTOP</text>

  <!-- Streamlit UI -->
  <rect x="60" y="120" width="220" height="90" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="170" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Streamlit chat UI</text>
  <text x="170" y="183" text-anchor="middle" font-size="13" fill="#475569">employee asks a question</text>

  <!-- Agent tools -->
  <rect x="330" y="220" width="240" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="450" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Agent tools (Python)</text>
  <rect x="350" y="258" width="200" height="28" rx="14" fill="#ffffff" stroke="#fdba74"/>
  <text x="450" y="277" text-anchor="middle" font-size="13" font-family="Consolas, Menlo, monospace" fill="#9a3412">search_documents</text>
  <rect x="350" y="294" width="200" height="28" rx="14" fill="#ffffff" stroke="#fdba74"/>
  <text x="450" y="313" text-anchor="middle" font-size="13" font-family="Consolas, Menlo, monospace" fill="#9a3412">explore_entity</text>
  <rect x="350" y="330" width="200" height="28" rx="14" fill="#ffffff" stroke="#fdba74"/>
  <text x="450" y="349" text-anchor="middle" font-size="13" font-family="Consolas, Menlo, monospace" fill="#9a3412">query_graph</text>

  <!-- Neo4j -->
  <rect x="330" y="410" width="240" height="90" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="450" y="447" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Neo4j (Docker)</text>
  <text x="450" y="472" text-anchor="middle" font-size="13" fill="#065f46">knowledge graph + vector index</text>

  <!-- Documents -->
  <rect x="60" y="580" width="220" height="90" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="170" y="617" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Zava documents</text>
  <text x="170" y="642" text-anchor="middle" font-size="13" fill="#475569">7 files · data/raw/</text>

  <!-- build_graph.py -->
  <rect x="330" y="540" width="240" height="180" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="567" text-anchor="middle" font-size="16" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#0f172a">build_graph.py</text>
  <text x="352" y="596" font-size="13.5" fill="#1e3a8a">① read PDFs</text>
  <text x="352" y="619" font-size="13.5" fill="#1e3a8a">② split into chunks</text>
  <text x="352" y="642" font-size="13.5" fill="#1e3a8a">③ embed chunks</text>
  <text x="352" y="665" font-size="13.5" fill="#1e3a8a">④ extract entities + relations</text>
  <text x="352" y="688" font-size="13.5" fill="#1e3a8a">⑤ save to Neo4j</text>
  <text x="450" y="710" text-anchor="middle" font-size="11.5" fill="#64748b">results cached in data/cache/</text>

  <!-- ================= AZURE REGION ================= -->
  <rect x="640" y="80" width="530" height="660" rx="16" fill="#f0f7ff" stroke="#0078d4" stroke-width="2"/>
  <text x="662" y="108" font-size="15" font-weight="700" fill="#0078d4" letter-spacing="1.5">AZURE</text>

  <!-- Foundry project -->
  <rect x="660" y="120" width="490" height="360" rx="14" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
  <text x="680" y="147" font-size="15" font-weight="700" fill="#0078d4">Microsoft Foundry project</text>

  <!-- Agent -->
  <rect x="690" y="160" width="430" height="100" rx="12" fill="#dbeafe" stroke="#0078d4" stroke-width="2"/>
  <text x="905" y="196" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Zava Agent</text>
  <text x="905" y="220" text-anchor="middle" font-size="14" fill="#1e3a8a">Foundry Agent Service</text>
  <text x="905" y="243" text-anchor="middle" font-size="12.5" fill="#475569">picks tools · writes the answer with sources</text>

  <!-- Models -->
  <text x="1118" y="304" text-anchor="end" font-size="12.5" font-weight="600" fill="#475569" letter-spacing="1">MODEL DEPLOYMENTS</text>
  <rect x="690" y="315" width="205" height="70" rx="12" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
  <text x="792" y="345" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Chat model</text>
  <text x="792" y="368" text-anchor="middle" font-size="12" fill="#475569">extract · Text2Cypher · answer</text>
  <rect x="915" y="315" width="205" height="70" rx="12" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
  <text x="1017" y="345" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Embedding model</text>
  <text x="1017" y="368" text-anchor="middle" font-size="12" fill="#475569">text → vectors</text>

  <!-- Agent uses chat model -->
  <line x1="792" y1="262" x2="792" y2="312" stroke="#475569" stroke-width="2" marker-end="url(#gray)"/>
  <text x="802" y="292" font-size="12" fill="#475569">uses</text>

  <!-- Document Intelligence -->
  <rect x="660" y="560" width="490" height="100" rx="14" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
  <text x="905" y="600" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Azure AI Document Intelligence</text>
  <text x="905" y="626" text-anchor="middle" font-size="13" fill="#475569">layout model · PDF → Markdown (headings, tables, pages)</text>

  <!-- ================= FLOW B: ANSWER A QUESTION (orange) ================= -->
  <!-- question -->
  <line x1="282" y1="175" x2="686" y2="175" stroke="#ea580c" stroke-width="2.5" marker-end="url(#orange)"/>
  <text x="470" y="167" text-anchor="middle" font-size="13" font-weight="600" fill="#c2410c">question</text>
  <!-- answer -->
  <line x1="686" y1="205" x2="284" y2="205" stroke="#ea580c" stroke-width="2.5" marker-end="url(#orange)"/>
  <text x="470" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#c2410c">answer + sources</text>
  <!-- agent <-> tools -->
  <line x1="686" y1="245" x2="574" y2="245" stroke="#ea580c" stroke-width="2.5" marker-start="url(#orange)" marker-end="url(#orange)"/>
  <text x="630" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">tool calls</text>
  <text x="630" y="279" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">⇄ results</text>
  <!-- tools <-> neo4j -->
  <line x1="450" y1="373" x2="450" y2="407" stroke="#ea580c" stroke-width="2.5" marker-start="url(#orange)" marker-end="url(#orange)"/>
  <text x="462" y="395" font-size="12" font-weight="600" fill="#c2410c">Cypher (read-only)</text>

  <!-- ================= FLOW A: BUILD THE GRAPH (blue) ================= -->
  <!-- documents -> build -->
  <line x1="282" y1="625" x2="327" y2="625" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"/>
  <!-- build <-> document intelligence -->
  <line x1="573" y1="620" x2="657" y2="620" stroke="#2563eb" stroke-width="2.5" marker-start="url(#blue)" marker-end="url(#blue)"/>
  <text x="615" y="612" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">①</text>
  <!-- build -> models -->
  <polyline points="572,560 622,560 622,505 1017,505 1017,388" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"/>
  <line x1="792" y1="505" x2="792" y2="388" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"/>
  <text x="905" y="527" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d4ed8">③ embed chunks  ·  ④ extract entities</text>
  <!-- build -> neo4j -->
  <line x1="450" y1="538" x2="450" y2="503" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"/>
  <text x="462" y="526" font-size="12.5" font-weight="700" fill="#1d4ed8">⑤ save</text>

  <!-- ================= LEGEND ================= -->
  <line x1="40" y1="772" x2="85" y2="772" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
  <text x="95" y="777" font-size="14" fill="#0f172a"><tspan font-weight="700">A</tspan> · Build the knowledge graph (run once)</text>
  <line x1="420" y1="772" x2="465" y2="772" stroke="#ea580c" stroke-width="3" marker-end="url(#orange)"/>
  <text x="475" y="777" font-size="14" fill="#0f172a"><tspan font-weight="700">B</tspan> · Answer a question</text>
  <rect x="700" y="762" width="18" height="18" rx="4" fill="#f0f7ff" stroke="#0078d4" stroke-width="2"/>
  <text x="726" y="777" font-size="14" fill="#0f172a">Azure service</text>
  <rect x="850" y="762" width="18" height="18" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="876" y="777" font-size="14" fill="#0f172a">Runs locally</text>
</svg>
